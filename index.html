<style>
:root{color-scheme:light;--bg:#F3F8F5;--card:#FFFFFF;--ink:#10261B;--mut:#4F6B5C;--line:#DCE9E1;--soft:#EEF6F1;--brand:#0B5D3B;--pri:#00A859;--acc:#00A859;
--ag:#F2C500;--upe:#2E9E3F;--cab:#1E86C0;--hdd:#C2187A;--mor:#D9480F;--warn:#A35F00;--frio:#1D6FD1;
--hbg:var(--brand);--hink:#FFFFFF;--disp:Figtree,system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:6;background:var(--hbg);color:var(--hink);padding:calc(12px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 24px 24px;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:8px;transition:background .25s}
body.res header{border-radius:0}
header a{color:inherit;text-decoration:none}
.logo{width:48px;height:48px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center}
.gear{width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:inherit;padding:0;justify-self:end}
body.res .gear{background:rgba(0,0,0,.1)}
.htitle{justify-self:center;font-family:var(--disp);font-weight:800;font-size:28px;line-height:1;min-height:48px;display:flex;align-items:center;background:none;border:0;color:inherit;padding:0}
main{max-width:760px;margin:0 auto;padding:16px 16px}
button,.btn{font:inherit;font-size:16px;min-height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #FF6A3D;outline-offset:2px}
.pri{background:var(--pri);border:0;color:#fff;font-family:var(--disp);font-weight:800}
input[type=search],input[type=time],textarea{font:inherit;font-size:16px;width:100%;min-height:52px;padding:10px 16px;border-radius:16px;border:1.5px solid #CFE3D8;background:var(--card);color:var(--ink)}
textarea{min-height:90px}
.searchbox{position:relative}.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none}.searchbox input{padding-left:46px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mt{margin-top:12px}.mut{color:var(--mut);font-size:14px}
h2{font-family:var(--disp);font-size:22px;margin:18px 0 8px}
.cam{position:relative;background:#1A2A22;border-radius:22px;overflow:hidden;aspect-ratio:4/3;max-height:46vh;width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .guide{position:absolute;inset:18% 10%}
.cam .guide i{position:absolute;width:34px;height:34px;border:5px solid var(--pri)}
.cam .guide i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.cam .guide i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.cam .guide i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 10px}.cam .guide i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.cam .tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.cam .tools button{background:rgba(0,0,0,.55);color:#fff;border:0;min-width:44px;border-radius:50%;padding:0}
.cam .off{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px}
.cam .pill{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:7px 12px;border-radius:999px;max-width:calc(100% - 24px)}
.hint{margin:12px 0;text-align:center;font-size:15px;color:#3D5A4B}
.dot{width:9px;height:9px;border-radius:50%;background:#9AB0A3;flex:none}.dot.on{background:#3BE08A;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
.list{list-style:none;margin:8px 0 0;padding:0;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}.list li{border-bottom:1px solid var(--line)}.list li:last-child{border-bottom:0}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:0;padding:12px 14px;justify-content:flex-start}

.item .t{display:block;font-weight:600;font-size:15px}.item .s{display:block;color:var(--mut);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}

/* resultado */
#v-res{margin:-16px -16px 0;min-height:calc(100vh - 160px);display:flex;flex-direction:column;background:var(--k);color:var(--kf,#fff)}
.rtop{padding:16px 20px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.rwhy{font-size:14px;font-weight:600}

.rgroup{font-family:var(--disp);font-weight:800;font-size:clamp(36px,11vw,46px);line-height:1}
.rzone{display:flex;align-items:center;gap:10px;background:var(--kf,#fff);color:var(--k);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px}
.rzone b{font-family:var(--disp);font-weight:800;font-size:22px}
.rsheet{flex:1;background:var(--card);color:var(--ink);border-radius:28px 28px 0 0;padding:20px 20px 24px;display:flex;flex-direction:column;gap:14px}

.tile{background:var(--soft);border-radius:14px;padding:10px 14px}.tile small{display:block;font-size:12px;color:var(--mut);font-weight:600}.tile b{font-family:var(--disp);font-weight:800;font-size:24px;overflow-wrap:anywhere}

/* ubicaciones */
.gcard{display:flex;align-items:center;gap:14px;width:100%;background:var(--k);color:var(--kf,#fff);border:0;border-radius:20px;padding:14px 16px;min-height:80px;text-align:left;margin-top:10px}

.gcard[data-g=ag] .gi{background:#1B1400;color:#F2C500}
.gcard .gn{font-family:var(--disp);font-weight:800;font-size:20px;flex:1}
.shead{display:flex;align-items:center;gap:10px;width:100%;background:var(--k);color:var(--kf,#fff);border:0;border-radius:12px;padding:6px 10px 6px 6px;min-height:44px;text-align:left;margin-top:6px}

.gk-ag .shead .sc{background:rgba(27,20,0,.1)}
.shead .sn{flex:1;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .sq{font-size:12px;font-weight:600;opacity:.8}
.shead svg{flex:none;width:18px;height:18px;transition:transform .2s}.shead[aria-expanded=true] svg{transform:rotate(90deg)}
.shead[aria-expanded=true]{border-radius:12px 12px 4px 4px}
.sbody{margin:2px 0 8px}
.subs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.subs button{min-height:40px;font-size:14px;padding:6px 12px;border-radius:999px}
.subs button[aria-pressed=true]{background:var(--k);color:var(--kf,#fff);border-color:transparent}
/* CN */
.cnbig{font-family:var(--disp);font-size:34px;font-weight:800;letter-spacing:.02em;margin:6px 0}
.note{border-left:4px solid var(--warn);padding:8px 12px;background:#FFF8DC;border-radius:0 8px 8px 0;font-size:15px}
.ok{border-left:4px solid var(--pri);padding:8px 12px;background:var(--soft);border-radius:0 8px 8px 0;margin-top:10px}
.ok a,.note a{color:var(--brand);font-weight:700}
.cb{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:2px}
.rxl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.rxin{font:inherit;font-size:15px;min-height:42px;padding:6px 10px;border-radius:10px;border:1.5px solid #CFE3D8;background:#fff;color:var(--ink);width:100%}
#cadf button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:transparent}
.bigb{width:100%;min-height:72px;font-size:21px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:4px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.pbtn{min-height:76px;font-size:19px;font-weight:700;border-radius:18px;background:var(--card);border:2px solid var(--line);color:var(--brand);font-family:var(--disp)}
.arrc{display:flex;flex-direction:column;gap:10px;background:var(--soft);border:2px solid var(--pri);border-radius:18px;padding:14px;margin-top:12px;font-size:16px}.arrc.done{border-color:var(--line);background:var(--card)}.pbtn[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.arrc .pri{min-height:56px;font-size:18px;border-radius:16px}
.empty{padding:18px;text-align:center;color:var(--mut);border:1px dashed #BFD6C8;border-radius:16px;margin-top:12px}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}header{transition:none}}
</style>

<script>
{
/* ---------- ubicaciones y grupos ---------- */
const GROUPS={ag:'Almacén General',upe:'UPE',cab:'Cabinas',hdd:'Hospital de Día',mor:'Mórficos',warn:'Revisar ubicación'};
const GORD=['ag','upe','cab','hdd','mor','warn'];
const ZONES=[
['A.G.',2,'Almacén general','ag'],['A.F.',1,'Almacén fuera guía','ag'],['M.E.',3,'Medicación extranjera','ag'],['N.E.',4,'Nutrición enteral','ag'],['A.P.',5,'Pomadas','ag'],['A.S.',7,'Sueros','ag'],['A.U.',7,'Sueros y leches infantiles','ag'],['ANT',9,'Antisépticos','ag'],['COL',12,'Colirios y pomadas oftálmicas','ag'],['CON',13,'Contrastes','ag'],['CONG',14,'Congelador farmacia','ag'],['NEV',20,'Cámara frigorífica (med. general)','ag'],['NPT',21,'Nutrición parenteral','ag'],
['UPE',8,'Armario medicación UPE · unidosis','upe'],['ADM',null,'Dispensación ambulatoria · edificio NEA 136','upe'],['NEA',null,'Nevera dispensación ambulatoria · NEA 136','upe'],['NEI',17,'Nevera intravítreas + Aranesp + Curosurf + Xembify','upe'],['NEL',19,'Nevera laboratorio galénica','upe'],
['CIT',10,'Citostáticos parenterales (interior cabinas)','cab'],['LAB',16,'Materias primas laboratorio','cab'],['NECI',18,'Nevera citostáticos','cab'],
['CITO',null,'Citostáticos orales · pasillo NEA 305','hdd'],['NECHDD',null,'Nevera citos consulta 305 · NEA','hdd'],
['EST',15,'Estupefacientes','mor']];
const Z={};ZONES.forEach((z,i)=>Z[z[0]]={code:z[0],num:z[1],name:z[2],g:z[3],ord:i});
const zone=c=>Z[c]||{code:c,num:null,name:'Código que no aparece en el esquema',g:'warn',ord:99};
const gcol=g=>`var(--${g})`+(g==='ag'?';--kf:#1B1400':'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- datos ---------- */
let MEDS=[],BY={},VOC={},IDF={};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/(\d),(\d)/g,'$1.$2').replace(/(\d)(MG|MCG|ML|UI|G|MGR|KG|L|%)\b/g,'$1 $2').replace(/[^A-Z0-9.%]+/g,' ').replace(/(^|\s)\.+|\.+(\s|$)/g,' ').trim();
const toks=s=>norm(s).split(' ').filter(t=>t.length>1||/\d/.test(t));
const nameOf=m=>m.den||m.pa;
let links=new Map(Object.entries(ls.get('cnLinks',{})));
fetch('meds.json').then(r=>r.json()).then(rows=>{
  MEDS=rows.map((r,i)=>{const m={u:r[0],pa:r[1],den:r[2],sap:r[3],note:r[4]};m.k=m.sap||('x'+i);m.t=[...new Set(toks(m.pa+' '+m.den+' '+m.sap))];return m});
  MEDS.forEach(m=>{BY[m.k]=m;m.t.forEach(t=>VOC[t]=(VOC[t]||0)+1)});
  for(const t in VOC)IDF[t]=Math.log(1+MEDS.length/VOC[t]);
  MEDS.forEach(m=>m.w=Math.sqrt(m.t.reduce((a,t)=>a+IDF[t],0)));
  extras.forEach(addMed);
  renderUbic();renderCN();flush();
}).catch(()=>{$('#out').innerHTML='<div class="empty">No se ha podido cargar el listado.</div>'});

function search(q){
  {const d=q.replace(/\D/g,'');if(/^\d{8,14}$/.test(q.trim())){const g='G'+d.padStart(14,'0');if(links.has(g)&&BY[links.get(g).k])return[BY[links.get(g).k]]}}
  const d=q.replace(/\D/g,'');if(/^\d{6,7}$/.test(q.trim())&&links.has(d.slice(0,6))&&BY[links.get(d.slice(0,6)).k])return[BY[links.get(d.slice(0,6)).k]];
  const qt=toks(q);if(!qt.length)return[];const res=[];
  for(const m of MEDS){let ok=true,ex=0;for(const t of qt){let hit=false;for(const v of m.t){if(v===t){hit=true;ex++;break}if(v.startsWith(t))hit=true}if(!hit){ok=false;break}}if(ok)res.push([ex,m])}
  return res.sort((a,b)=>b[0]-a[0]||(a[1].pa+a[1].den).length-(b[1].pa+b[1].den).length).slice(0,40).map(x=>x[1]);

const cimaURL=cn=>'https://cima.aemps.es/cima/rest/presentacion/'+encodeURIComponent(cn);
async function cima(cn){

    if(r.status===404||r.status===204){const v={none:true};cimaCache.set(cn,v);saveCima();return v}
    if(!r.ok)return {err:true};
    const txt=await r.text();if(!txt.trim()){const v={none:true};cimaCache.set(cn,v);saveCima();return v}
    const j=JSON.parse(txt);const v={nombre:String(j.nombre||''),comerc:!!j.comerc,lab:String(j.labtitular||''),nreg:String(j.nregistro||'').replace(/\D/g,''),pa:(Array.isArray(j.principiosActivos)?j.principiosActivos:[]).map(x=>({n:String(x.nombre||''),c:String(x.cantidad||''),u:String(x.unidad||'')})),atc:(()=>{const a=(Array.isArray(j.atcs)?j.atcs:[]).find(x=>+x.nivel===4);return a?{c:String(a.codigo),n:String(a.nombre)}:null})()};cimaCache.set(cn,v);saveCima();return v}

const LABS=new Set('CINFA NORMON KERN PHARMA TEVA SANDOZ MYLAN VIATRIS AUROVITAS STADA ACCORD ARISTO KRKA ZENTIVA APOTEX RATIOPHARM ALTER COMBIX QUALIGEN PENSA BEXAL LICONSA ACTAVIS FRESENIUS KABI BRAUN BAXTER GRIFOLS HOSPIRA PFIZER TECNIGEN URIACH ESTEVE FERRER MABO GLENMARK DAVUR EDIGEN RANBAXY SUN VIR AMNEAL ZYDUS CIPLA LUPIN DR REDDYS ALMUS BLUEPHARMA MEDICAL FARMALIDER GENFARMA'.split(' '));
function cimaSugs(nombre){
  const head=norm(nombre).split(/\s\d/)[0].split(' ').filter(t=>t.length>=4&&!STOP.has(t)&&!LABS.has(t));
  if(!head.length)return[];const key=head[0],ds=doses(nombre);
  return MEDS.map(m=>{if(!m.t.some(v=>v===key||(v.length>=5&&lev(v,key,1)<=1)))return null;const dm=doses(m.pa+' '+m.den);let sc=1;if([...ds].some(d=>dm.has(d)))sc+=2;head.slice(1).forEach(h=>{if(m.t.includes(h))sc+=1});return{sc,m}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,4).map(x=>x.m);
}
function compare(c,m){
  const mt=new Set(m.t),ct=toks(c.nombre).filter(t=>t.length>=5&&!/\d/.test(t)&&!STOP.has(t)&&!LABS.has(t));
  const name=ct.some(t=>mt.has(t)||m.t.some(v=>v.length>=5&&lev(v,t,1)<=1));
  const dc=doses(c.nombre),dm=doses(m.pa+' '+m.den);

/* ---------- equivalentes de otro laboratorio (mismo principio activo y dosis) ---------- */
const UNIT=u=>{u=norm(u).replace(/\s/g,'');if(/^(MG|MILIGRAMOS?)/.test(u))return'MG';if(/^(MCG|MICROGRAMOS?|UG)/.test(u))return'MCG';if(/^(G|GRAMOS?)$/.test(u)||/^G\//.test(u))return'G';if(/^(UI|U)/.test(u))return'UI';if(u.startsWith('%'))return'%';if(/^ML/.test(u))return'ML';return u.split('/')[0]};
const numS=n=>String(+(+n).toFixed(4));
function canonD(n,u){n=+n;if(u==='G'){n*=1000;u='MG'}else if(u==='MCG'){n/=1000;u='MG'}return numS(n)+u}
function doseKeys(c,u){const n=parseFloat(String(c).replace(',','.'));return isFinite(n)?[canonD(n,UNIT(u))]:[]}
const medDoses=m=>new Set([...norm(m.pa+' '+m.den).matchAll(/(\d+(?:\.\d+)?) (MG|MCG|G|UI|%|ML)/g)].map(x=>canonD(x[1],x[2])));
function formCat(t){t=' '+norm(t)+' ';
  if(/ (COMP|COMPRIMIDOS?|CAPS|CAPSULAS?|GRAG|GRAGEAS|TABL)\b/.test(t))return'oral';
  if(/ (VIAL|VIALES|AMP|AMPOLLAS?|JER|JERINGAS?|INY|INYECTABLE|PLUMAS?|PERF|PERFUSION|BOLSA)\b/.test(t))return'iny';
  if(/ (CREMA|POMADA|GEL|TOP|UNGUENTO|EMULSION CUTANEA)\b/.test(t))return'top';
  if(/ (COLIRIO|OFT|OFTALMICA)\b/.test(t))return'oft';
  if(/ (SUPOS|SUPOSITORIOS?|RECTAL)\b/.test(t))return'rect';
  if(/ (INHAL|AEROSOL|NEBUL)\b/.test(t))return'inh';
  if(/ (SOBRES?|SOB|POLVO)\b/.test(t))return'sob';
  if(/ (JARABE|SUSP|SUSPENSION|GOTAS|SOL ORAL|SOLUCION ORAL)\b/.test(t))return'liq';
  return'';}
function equivalents(r){
  if(!r||!r.pa||!r.pa.length)return[];
  const pas=r.pa.map(p=>({keys:toks(p.n).filter(t=>t.length>=4&&!/\d/.test(t)&&!STOP.has(t)&&!LABS.has(t)),dose:doseKeys(p.c,p.u)})).filter(p=>p.keys.length);
  if(!pas.length||pas.some(p=>!p.dose.length))return[];
  const fc=formCat(r.nombre);
  return MEDS.filter(m=>{
    const md=medDoses(m);if(!md.size||md.size>pas.length)return false;
    if(!pas.every(p=>p.keys.some(k=>m.t.includes(k))&&p.dose.some(d=>md.has(d))))return false;
    const mf=formCat(m.pa+' '+m.den);return !fc||!mf||fc===mf;
  });
}

/* ---------- buscar por CN en el buscador: qué es y su par más cercano ---------- */
const atcCache=new Map();
async function atcPAs(code){

}
const paKeys=n=>toks(n).filter(t=>t.length>=4&&!/\d/.test(t)&&!STOP.has(t)&&!LABS.has(t));

/* ---------- texto de la caja → CIMA por nombre → su par en la guía ---------- */
const cimaNameCache=new Map();let lastCimaTry=0,lastCimaWords='';
async function cimaByName(w){if(cimaNameCache.has(w))return cimaNameCache.get(w);let res=[];
  try{const r=await fetch('https://cima.aemps.es/cima/rest/medicamentos?nombre='+encodeURIComponent(w)+'&pagina=1');if(r.ok){const j=await r.json();res=(j.resultados||[]).slice(0,60).map(x=>({nombre:String(x.nombre||''),vtm:String(x.vtm&&x.vtm.nombre||''),dosis:String(x.dosis||''),lab:String(x.labtitular||''),nreg:String(x.nregistro||'')}))}}catch(e){}
  cimaNameCache.set(w,res);return res}
async function cimaFromText(text){
  const T=toks(text),TS=new Set(T),nums=new Set(T.filter(t=>/^\d/.test(t)).map(t=>numS(t)));
  const words=[...new Set(T.filter(t=>t.length>=5&&!/\d/.test(t)&&!STOP.has(t)&&!LABS.has(t)&&!COMMON.has(t)))].slice(0,4);
  if(!words.length)return null;
  let best=null;
  for(const w of words){
    for(const x of await cimaByName(w)){
      const nt=toks(x.nombre).filter(t=>!/\d/.test(t)&&t.length>=4&&!STOP.has(t));
      let sc=nt.filter(t=>TS.has(t)).length*2;
      const dm=x.dosis.match(/(\d+(?:[.,]\d+)?)/);if(dm&&nums.has(numS(dm[1].replace(',','.'))))sc+=3;
      if(!best||sc>best.sc)best={...x,sc};
    }
    if(best&&best.sc>=5)break;
  }
  if(!best||best.sc<4)return null;
  const dm=best.dosis.match(/(\d+(?:[.,]\d+)?)\s*([a-zµ%]+)/i);
  return {nombre:best.nombre,lab:best.lab,nreg:best.nreg,vtm:best.vtm,pa:best.vtm&&dm&&!/[+\/]| y /.test(best.vtm)?[{n:best.vtm,c:dm[1],u:dm[2]}]:(best.vtm?[{n:best.vtm,c:'',u:''}]:[])};
}
const COMMON=new Set(['COMPRIMIDOS','RECUBIERTOS','PELICULA','CAPSULAS','SOLUCION','INYECTABLE','ENVASE','CONTIENE','LEASE','PROSPECTO','ANTES','UTILIZAR','MEDICAMENTO','MEDICAMENTOS','CONSERVAR','TEMPERATURA','ALCANCE','NIÑOS','NINOS','VISTA','ORAL','INTRAVENOSA','SUBCUTANEA','INTRAMUSCULAR','EXCIPIENTES','CADA','LOTE','CADUCIDAD','RECETA','MEDICA','USO','HOSPITALARIO','DISPENSACION','PLUMA','PRECARGADA','JERINGA','VIALES','AMPOLLAS','SOBRES','GASTRORRESISTENTES','LIBERACION','PROLONGADA','DURAS','BLANDAS','EFERVESCENTES','DISPERSABLES','BUCODISPERSABLES','POLVO','PARA','CONCENTRADO','PERFUSION','SUSPENSION','JARABE','GOTAS','CREMA','POMADA','COLIRIO','AEROSOL','INHALACION','ESPAÑA','ESPANA','MADRID','BARCELONA','LABORATORIOS','PHARMA','FARMA','GMBH','LIMITED','LTD','IRELAND','GERMANY']);
async function tryCimaText(text,force){
  if(!text||locked)return;const now=Date.now();
  const sig=toks(text).filter(t=>t.length>=5).slice(0,4).join(' ');
  if(!force&&(now-lastCimaTry<4000||sig===lastCimaWords))return;lastCimaTry=now;lastCimaWords=sig;
  const r=await cimaFromText(text);if(!r||locked)return;
  const eq=r.pa.length&&r.pa[0].c?equivalents(r):[];
  const keys=[...new Set(r.pa.flatMap(p=>paKeys(p.n)))];
  const same=keys.length?MEDS.filter(m=>!eq.includes(m)&&keys.some(k=>m.t.includes(k))):[];
  if(eq.length&&eq.every(e=>e.u===eq[0].u)){
    const fc=formCat(r.nombre),k=(eq.find(e=>formCat(e.pa+' '+e.den)===fc)||eq[0]).k;
    lock(k,'Reconocido por el nombre de la caja');
    const sh=$('#v-res .rsheet');if(sh)sh.insertAdjacentHTML('afterbegin',`<div class="banner bok"><div><b>Según la caja y CIMA:</b> ${esc(r.nombre)}${r.lab?' · '+esc(r.lab):''}. Mismo principio activo y dosis que el de la guía.</div></div>`);
    return;
  }
  if(!eq.length&&!same.length)return;
  state('Parece '+r.nombre.toLowerCase()+'. ¿Es alguno de estos?',true);
  $('#out').innerHTML=`<div class="banner bok mt"><div><b>Según la caja y CIMA:</b> ${esc(r.nombre)}${r.lab?' · '+esc(r.lab):''}</div></div>`+
   (eq.length?'<p class="mut" style="margin:10px 2px 0">Mismo principio activo y dosis:</p>'+itemList(eq.slice(0,6),'pick'):'')+
   (same.length?'<p class="mut" style="margin:10px 2px 0">Mismo principio activo:</p>'+itemList(same.slice(0,6),'pick'):'');
}

let gBusy=false,gLast=0;
function jpeg64(src,max){const w=src.videoWidth||src.width,h=src.videoHeight||src.height,sc=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85).split(',')[1]}
async function googleOCR(src){

  try{const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({accion:'ocr',clave:cfg.clave,img:jpeg64(src,1600)})});const j=await r.json();return j.ok?String(j.texto||''):''}

function parseGS1(raw){
  const s0=String(raw||'').replace(/^\]d2|^\]C1|^\]Q3/,'');const o={};
  if(/\(\d{2,4}\)/.test(s0)){for(const m of s0.matchAll(/\((\d{2,4})\)([^(]*)/g))o[m[1]]=m[2].trim()}
  else{let s=s0;const FIX={'01':14,'02':14,'11':6,'15':6,'17':6},GS='\x1d';let guard=0;
    while(s.length>2&&guard++<10){if(s[0]===GS){s=s.slice(1);continue}const ai=s.slice(0,2);
      if(FIX[ai]){o[ai]=s.substr(2,FIX[ai]);s=s.slice(2+FIX[ai]);continue}
      if(ai==='10'||ai==='21'){let rest=s.slice(2),end=rest.indexOf(GS);
        if(end<0){const m=rest.slice(1).match(/17\d{2}(0[1-9]|1[0-2])\d{2}(?=(10|21|$))/);end=m?m.index+1:rest.length}
        o[ai]=rest.slice(0,end);s=rest.slice(end);continue}
      break}}
  const c=o['17'];let cad='';
  if(c&&/^\d{6}$/.test(c)){const y=2000+ +c.slice(0,2),mo=+c.slice(2,4);let d=+c.slice(4,6);if(!d)d=new Date(y,mo,0).getDate();cad=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
  return {gtin:o['01']||'',lote:(o['10']||'').replace(/\x1d/g,''),cad,serie:(o['21']||'').replace(/\x1d/g,'')};
}

let wbuf='',wlast=0,wstart=0,wfield=null,wbefore='',lastRaw='';

  }
  if(e.ctrlKey&&(e.key===']'||e.code==='BracketRight'||e.key===String.fromCharCode(29))){wbuf+='\x1d';e.preventDefault();return}
  if(e.key&&e.key.length===1)wbuf+=e.key;

  if(!isCN(pendingCN))return codePanel();
  const cn=pendingCN,cur=links.get(cn),m=cur&&BY[cur.k];
  state(`Código leído: CN ${cn}`,false);
  const sug=lastText?matchText(lastText).map(x=>x.m).slice(0,4):[];
  $('#sres').innerHTML='';$('#out').innerHTML=`<div class="cnbig" style="margin-top:10px">CN ${esc(cn)} <span class="mut" style="font-size:15px;font-weight:600">${m?'':'· nuevo'}</span></div>
  ${cimaSlot(cn,'')}
  ${m?`<div class="ok">Ya está asignado a <b>${esc(m.pa)}</b> · SAP ${esc(m.sap)} · ${esc(m.u)}. Si no es correcto, elige otro abajo.</div>`:'<p>¿A qué medicamento del listado corresponde?</p>'}
  <div id="cnsug">${sug.length?'<p class="mut">Sugerencias por lo que se lee en la caja:</p>'+itemList(sug,'cnpick'):''}</div>
  <div class="mt"><input id="cnq" type="search" placeholder="Busca el medicamento por nombre o SAP" aria-label="Buscar medicamento para el CN"></div><div id="cnres"></div>
  ${addBtn(cn,'')}<div class="row mt"><button data-act="cnnext">Cancelar y seguir escaneando</button></div>`;
  cima(cn).then(r=>{if(pendingCN!==cn||!r.nombre)return;const box=$('#cnsug');
    const eq=equivalents(r);
    if(eq.length&&!m&&!noAuto.has(cn)&&eq.every(e=>e.u===eq[0].u)){const fc=formCat(r.nombre),k=(eq.find(e=>formCat(e.pa+' '+e.den)===fc)||eq[0]).k;link(cn,k);pendingCN='';locked=k;$('#out').innerHTML='';vib();
      showRes(k,`✓ Equivalente de otro laboratorio (CN ${cn})`,`<button data-act="undoeq" data-cn="${esc(cn)}">No es este</button>`);
      const sh=$('#v-res .rsheet');if(sh)sh.insertAdjacentHTML('afterbegin',`<div class="banner bok"><div><b>Asignado automáticamente.</b> Mismo principio activo y dosis que el del listado; la caja es de ${esc(r.lab||'otro laboratorio')}.</div></div>`);return}
    if(!box)return;
    if(eq.length){box.innerHTML='<p class="mut">Mismo principio activo y dosis (otro laboratorio):</p>'+itemList(eq.slice(0,6),'cnpick');return}
    const s2=cimaSugs(r.nombre);if(s2.length)box.innerHTML='<p class="mut">Según CIMA, puede ser:</p>'+itemList(s2,'cnpick')});
  $('#cnq').addEventListener('input',e=>{const r=search(e.target.value);$('#cnres').innerHTML=e.target.value.trim()?(r.length?itemList(r.slice(0,15),'cnpick'):'<div class="empty">Nada coincide.</div>'):''});
}
let cnOpen=new Set();
function renderCN(){
  const arr=[...links].map(([c,v])=>[c,BY[v.k]]).filter(x=>x[1]);
  const chev='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  const sec=(id,ico,title,badge,body)=>`<button class="shead" data-act="cnsec" data-s="${id}" aria-expanded="${cnOpen.has(id)}"><span class="sc">${ico}</span><span class="sn">${title}</span><span class="sq">${badge}</span>${chev}</button>${cnOpen.has(id)?`<div class="sbody" style="padding:4px 2px 8px">${body}</div>`:''}`;
  const I=d=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const hojaBadge=!hojaOK()?'Sin conectar':syncErr?'⚠ Sin conexión':queue.length?queue.length+' pendiente'+(queue.length>1?'s':''):'✓ Conectada';
  const asig=arr.length?`<ul class="list">${arr.map(([c,m])=>`<li class="row" style="padding:8px 12px;justify-content:space-between"><span>${chip(m)} <b>${isCN(c)?'CN: '+esc(c):'Cód.: '+esc(c.slice(1))}</b> · SAP: ${esc(m.sap)}<br><span class="mut">${esc(m.pa)}</span></span><button data-act="unlink" data-cn="${esc(c)}">Quitar</button></li>`).join('')}</ul>`:'<div class="empty">Todavía no hay ninguno.</div>';
  const zebra=`<p class="mut" style="margin-top:4px">Con el lector configurado como teclado (Zebra DataWedge: salida «Keystroke», con Intro al final), basta con escanear en cualquier pantalla de la app: no hace falta la cámara.</p>
  <div class="searchbox"><input id="wtest" type="search" placeholder="Toca aquí y escanea para probar" aria-label="Prueba del lector"></div>
  <p class="mut mt">Último código recibido: <b id="wlast">${esc(lastRaw.replace(/\x1d/g,'⟨GS⟩'))||'ninguno'}</b></p>`;
  const hoja=hojaOK()?`<div class="${syncErr?'note':'ok'}" style="margin-top:4px">${syncErr?esc(syncErr):'✓ Conectada a la hoja de Google. Los CN se guardan allí y se comparten con quien use la misma hoja.'}<br><span class="mut">${lastSync?'Última sincronización: '+new Date(lastSync).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'Sin sincronizar todavía'}${queue.length?' · '+queue.length+' pendiente'+(queue.length>1?'s':''):''}</span></div>
  <div class="row mt"><button data-act="hojasync">Sincronizar ahora</button><button data-act="hojalink">Copiar enlace para compañeros</button><button data-act="hojaoff">Desconectar</button></div>`
  :`<p class="mut" style="margin-top:4px">Ahora los CN solo se guardan en este móvil. Conecta la hoja de Google para guardarlos en Drive y compartirlos.</p>${syncErr?`<div class="note">${esc(syncErr)}</div>`:''}
  <div class="mt"><input id="hurl" type="search" placeholder="Enlace de la hoja (https://script.google.com/…/exec)" value="${esc(cfg.url)}" aria-label="Enlace de la hoja"></div>
  <div class="row mt"><input id="hclave" type="search" placeholder="Clave" value="${esc(cfg.clave)}" style="flex:1;min-width:8em" aria-label="Clave"><button class="pri" data-act="hojasave">Conectar</button></div>`;
  $('#cnlist').innerHTML=`<h2>Escribir un CN a mano</h2><div class="row"><input id="cnin" type="search" inputmode="numeric" placeholder="6 dígitos, p. ej. 755348" style="flex:1;min-width:10em" aria-label="CN"><button class="pri" data-act="cnmanual">Asignar</button></div>
  <div style="--k:var(--brand);margin-top:22px">
  ${sec('asig',I('<path d="M4 6v12M8 6v12M11 6v12M15 6v12M17 6v12M20 6v12"/>'),'CN asignados',`${arr.length}`,asig)}
  ${sec('zebra',I('<path d="M4 9h11l3 3v3H4zM8 15v4M15 9V6"/>'),'Lector Zebra o pistola',lastRaw?'✓ Probado':'',zebra)}
  ${sec('hoja',I('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/>'),'Hoja compartida',hojaBadge,hoja)}
  </div>`;
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
